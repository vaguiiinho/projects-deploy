name: finance

services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finance_private

  api:
    image: vaguiiinho/finance-api
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      finance_private: {}
      proxy:
        aliases:
          - finance-api

  web:
    image: vaguiiinho/finance-web
    container_name: finance-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      proxy:
        aliases:
          - finance-web

networks:
  finance_private:
    name: finance-private
  proxy:
    external: true
    name: projects-deploy-proxy

volumes:
  finance_postgres_data:
    name: finance-postgres-data

