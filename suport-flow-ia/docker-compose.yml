name: suporte-flow-ia

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_flow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-support_flow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - suporte-flow-ia-private

  api:
    image: vaguiiinho/suporte-flow-ia-api:latest
    env_file:
      - ./.env
    volumes:
      - knowledge_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      suporte-flow-ia-private: {}
      proxy:
        aliases:
          - suporte-flow-ia-api

  worker:
    image: vaguiiinho/suporte-flow-ia-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ./.env
    volumes:
      - knowledge_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - suporte-flow-ia-private

  web:
    image: vaguiiinho/suporte-flow-ia-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    env_file:
      - ./.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      suporte-flow-ia-private: {}
      proxy:
        aliases:
          - suporte-flow-ia-web

networks:
  suporte-flow-ia-private:
    name: suporte-flow-ia-private
  proxy:
    external: true
    name: projects-deploy-proxy

volumes:
  postgres_data:
  knowledge_files: