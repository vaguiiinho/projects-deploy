name: catalog

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - catalog_private

  api:
    image: vaguiiinho/product-catalog-api:1.0.0
    container_name: catalog-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      catalog_private: {}
      proxy:
        aliases:
          - catalog-api

  web:
    image: vaguiiinho/product-catalog-web:1.0.0
    container_name: catalog-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://catalog-api:3001
      SITE_URL: ${PUBLIC_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      proxy:
        aliases:
          - catalog-web

  worker:
    image: vaguiiinho/product-catalog-worker:1.0.0
    container_name: catalog-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://catalog-api:3001
    networks:
      - proxy

networks:
  catalog_private:
    name: catalog-private
  proxy:
    external: true
    name: projects-deploy-proxy

volumes:
  catalog_postgres_data:
    name: catalog-postgres-data
